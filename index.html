<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okotune (s)</title>
  <meta name="description" content="Okotune (s) — Mphathisi Ecosystem">
  
  <!-- Modern Geometric Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07080c;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      --accent-glow-1: rgba(99, 102, 241, 0.18);
      --accent-glow-2: rgba(236, 72, 153, 0.12);
      --accent-glow-3: rgba(14, 165, 233, 0.12);
      --glass-bg: rgba(255, 255, 255, 0.035);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover-bg: rgba(255, 255, 255, 0.08);
      --glass-hover-border: rgba(255, 255, 255, 0.25);
    }

    body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient atmospheric glow */
    .ambient-mesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.85;
      animation: floatPulse 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 550px;
      height: 550px;
      top: 15%;
      left: 20%;
      background: radial-gradient(circle, var(--accent-glow-1) 0%, transparent 70%);
    }

    .orb-2 {
      width: 600px;
      height: 600px;
      bottom: 10%;
      right: 15%;
      background: radial-gradient(circle, var(--accent-glow-2) 0%, transparent 70%);
      animation-delay: -6s;
    }

    .orb-3 {
      width: 450px;
      height: 450px;
      top: 40%;
      right: 35%;
      background: radial-gradient(circle, var(--accent-glow-3) 0%, transparent 70%);
      animation-delay: -11s;
    }

    @keyframes floatPulse {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(40px, -30px) scale(1.08);
      }
      100% {
        transform: translate(-30px, 40px) scale(0.95);
      }
    }

    /* Subtle geometric grid backdrop overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      pointer-events: none;
      z-index: 1;
    }

    /* Center Stage Container */
    main.center-stage {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      user-select: none;
    }

    /* Main Centerpiece Title */
    h1.brand-title {
      font-size: clamp(2.8rem, 9vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 45%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.6));
      position: relative;
      cursor: default;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
      animation: entranceGlow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1.brand-title:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 0 50px rgba(255, 255, 255, 0.25));
    }

    @keyframes entranceGlow {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Bottom Corner Link */
    .bottom-corner {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 20;
    }

    .corner-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-muted);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .corner-link:hover {
      color: #ffffff;
      background: var(--glass-hover-bg);
      border-color: var(--glass-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.25);
    }

    .corner-link:active {
      transform: translateY(0);
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .bottom-corner {
        bottom: 1.5rem;
        right: 1.5rem;
      }
      .corner-link {
        padding: 0.55rem 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Atmospheric Lighting -->
  <div class="ambient-mesh" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Center Stage -->
  <main class="center-stage">
    <h1 class="brand-title">Okotune (s)</h1>
  </main>

  <!-- Bottom Corner Link -->
  <aside class="bottom-corner">
    <a href="https://mphathisi.com" target="_blank" rel="noopener noreferrer" class="corner-link" title="Visit mphathisi.com">
      M.P.A.S
    </a>
  </aside>
</body>
</html>
